aid: hellosign
name: Dropbox Sign (HelloSign)
description: >-
  Dropbox Sign (formerly HelloSign) is an eSignature platform whose v3 REST API
  lets developers send documents for legally binding electronic signature, build
  reusable templates, embed signing directly in their own apps, run bulk send
  jobs, and manage accounts, teams, and API apps. The API exposes 73 operations
  across 12 product areas (Signature Request, Template, Bulk Send, Embedded,
  Account, Team, Report, Fax, Fax Line, Unclaimed Draft, API App, OAuth), with
  API-key and OAuth 2.0 authentication, 23 webhook event types, official SDKs in
  six languages, and a published hosted documentation MCP server. HelloSign was a
  Y Combinator company (S11), acquired by Dropbox in 2019 and rebranded to Dropbox
  Sign in 2022; the API base host remains api.hellosign.com.
