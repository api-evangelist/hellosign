          type: string
        email_address:
          description: The email address of the signer.
          type: string
          format: email
        order:
          description: The order the signer is required to sign in.
          type: integer
          nullable: true
        pin:
          description: The 4- to 12-character access code that will secure this signer's signature page.
          type: string
          maxLength: 12
